name: Build Latex to PDF, then Deploy to Vercel
env:
  NEXT_TELEMETRY_DISABLED: 1
  VERCEL_TELEMETRY_DISABLED: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LATEX_IMAGE: ghcr.io/${{ github.repository }}/latex-cv:latest
  VERCEL_CLI_VERSION: 54.14.0

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.vercel-deploy.outputs.url }}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Cache generated application PDFs
        id: cache-pdf
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            public/cv.pdf
            public/resumes/
          key: ${{ runner.os }}-documents-${{ hashFiles('cv/**/*.tex', 'cv/**/*.bib', 'scripts/*cv*.sh', 'scripts/build-resumes.sh', '.github/docker/latex-cv/Dockerfile') }}

      - name: Log in to GHCR
        if: steps.cache-pdf.outputs.cache-hit != 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CV and role-specific résumés
        if: steps.cache-pdf.outputs.cache-hit != 'true'
        run: |
          docker pull --quiet "$LATEX_IMAGE"
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workdir" \
            -w /workdir \
            "$LATEX_IMAGE" \
            bash -c 'bash scripts/build-cv.sh && bash scripts/build-resumes.sh'

      - name: Cache Next.js Build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**/*', '!app/**/__tests__/**', '!app/**/*.test.*', 'components/**/*', '!components/**/__tests__/**', '!components/**/*.test.*', 'diary/**/*', 'lib/**/*', '!lib/**/__tests__/**', '!lib/**/*.test.*', 'mdx-components.tsx', 'next.config.*', 'postcss.config.*', 'tailwind.config.*', 'tsconfig.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test

      - name: Install Vercel CLI
        run: pnpm install -g vercel@$VERCEL_CLI_VERSION

      - name: Pull Vercel Environment Information
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production

      - name: Build Project Artifacts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod

      - name: Deploy Project Artifacts to Vercel
        id: vercel-deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod)
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
