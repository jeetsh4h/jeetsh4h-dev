name: Build Latex to PDF, then Deploy to Vercel
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEXT_TELEMETRY_DISABLED: 1
  VERCEL_TELEMETRY_DISABLED: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LATEX_IMAGE: ghcr.io/${{ github.repository }}/latex-cv:latest

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.vercel-deploy.outputs.url }}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6

      - name: Cache PDF
        id: cache-pdf
        uses: actions/cache@v5
        with:
          path: public/cv.pdf
          key: ${{ runner.os }}-pdf-${{ hashFiles('cv/**/*.tex', 'cv/**/*.bib', '.github/docker/latex-cv/Dockerfile') }}

      - name: Log in to GHCR
        if: steps.cache-pdf.outputs.cache-hit != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile LaTeX
        if: steps.cache-pdf.outputs.cache-hit != 'true'
        run: |
          docker pull --quiet "$LATEX_IMAGE"
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}/cv:/workdir \
            -w /workdir \
            "$LATEX_IMAGE" \
            latexmk -xelatex -file-line-error -halt-on-error -interaction=nonstopmode cv.tex

      - name: Copy PDF to /public
        if: steps.cache-pdf.outputs.cache-hit != 'true'
        run: |
          mkdir -p public
          if [ -f cv/cv.pdf ]; then cp cv/cv.pdf public/; fi

      - name: Cache Next.js Build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*', 'next.config.*', 'postcss.config.*', 'tailwind.config.*', 'tsconfig.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm install -g vercel@latest

      - name: Deploy to Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify
        run: pnpm lint && pnpm test

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: vercel-deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
