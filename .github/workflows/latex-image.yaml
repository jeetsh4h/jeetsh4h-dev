name: Build LaTeX CV Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/docker/latex-cv/**"
      - ".github/workflows/latex-image.yaml"

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LATEX_IMAGE: ghcr.io/${{ github.repository }}/latex-cv
  SHA_TAG: ghcr.io/${{ github.repository }}/latex-cv:sha-${{ github.sha }}
  LATEST_TAG: ghcr.io/${{ github.repository }}/latex-cv:latest

jobs:
  build-latex-image:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally
        run: |
          docker buildx build \
            --load \
            --cache-from type=gha,scope=latex-cv \
            --cache-to type=gha,mode=max,scope=latex-cv \
            -t "$SHA_TAG" \
            -t "$LATEST_TAG" \
            .github/docker/latex-cv

      - name: Smoke test image
        run: |
          docker run --rm "$SHA_TAG" sh -s <<'EOF'
          set -eu

          kpsewhich article.cls
          kpsewhich fontspec.sty
          kpsewhich geometry.sty
          kpsewhich xcolor.sty
          kpsewhich enumitem.sty
          kpsewhich hyperref.sty
          kpsewhich tabularx.sty
          kpsewhich titlesec.sty
          kpsewhich texgyrepagella-regular.otf

          cat > /tmp/fontcheck.tex <<'TEX'
          \documentclass{article}
          \usepackage{fontspec}
          \setmainfont{texgyrepagella}[
            Extension=.otf,
            UprightFont=*-regular,
            BoldFont=*-bold,
            ItalicFont=*-italic,
            BoldItalicFont=*-bolditalic,
            Ligatures=TeX
          ]
          \begin{document}
          OK
          \end{document}
          TEX

          cd /tmp
          latexmk -xelatex -file-line-error -halt-on-error -interaction=nonstopmode fontcheck.tex
          test -s fontcheck.pdf
          EOF

      - name: Push image
        run: |
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"
