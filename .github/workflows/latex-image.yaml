name: Build LaTeX CV Image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/docker/latex-cv/**"
      - ".github/workflows/latex-image.yaml"
      - "cv/**"
  push:
    branches:
      - main
    paths:
      - ".github/docker/latex-cv/**"
      - ".github/workflows/latex-image.yaml"

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LATEX_IMAGE: ghcr.io/${{ github.repository }}/latex-cv
  SHA_TAG: ghcr.io/${{ github.repository }}/latex-cv:sha-${{ github.sha }}
  LATEST_TAG: ghcr.io/${{ github.repository }}/latex-cv:latest

jobs:
  build-latex-image:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally
        run: |
          docker buildx build \
            --load \
            --cache-from type=gha,scope=latex-cv \
            --cache-to type=gha,mode=max,scope=latex-cv \
            -t "$SHA_TAG" \
            -t "$LATEST_TAG" \
            .github/docker/latex-cv

      - name: Smoke test CV build
        run: |
          docker run --rm \
            --network none \
            -v ${{ github.workspace }}/cv:/repo/cv:ro \
            "$SHA_TAG" \
            sh -lc '
              set -eu
              cp -R /repo/cv /tmp/cv
              cd /tmp/cv
              kpsewhich fontspec.sty
              kpsewhich texgyrepagella-regular.otf
              latexmk -xelatex -file-line-error -halt-on-error -interaction=nonstopmode cv.tex
              test -s cv.pdf
            '

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"
